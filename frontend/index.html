<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Chatbot</title>

<style>
:root{
  --red:#ff1824;
  --red2:#b9000b;
  --text:#ffffff;
  --muted:#9b9b9b;
  --panel:rgba(8,8,8,.72);
  --border:rgba(255,30,40,.45);
}

*{
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
}

body{
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;

  background:
    linear-gradient(
      rgba(0,0,0,.42),
      rgba(0,0,0,.62)
    ),
    url("background.jpg");

  background-size:cover;
  background-position:center;
  background-attachment:fixed;

  overflow:hidden;
}

/* DARK OVERLAY */

body::before{
  content:"";
  position:fixed;
  inset:0;

  background:
    radial-gradient(
      circle at center,
      rgba(255,0,20,.08),
      transparent 42%
    );

  pointer-events:none;
}

/* APP */

.app{
  width:100%;
  max-width:900px;
  height:100vh;
  margin:auto;

  display:flex;
  flex-direction:column;

  position:relative;
  z-index:1;

  padding:22px 28px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:5px 0 15px;
}

h1{
  margin:0;

  font-size:1.45rem;
  font-weight:700;
  letter-spacing:.3px;
}

h1 span{
  color:var(--red);
}

.controls{
  display:flex;
  align-items:center;
  gap:10px;
}

select{
  padding:9px 13px;

  border-radius:20px;
  border:1px solid rgba(255,255,255,.15);

  background:rgba(0,0,0,.65);
  color:white;

  font-size:.85rem;
  outline:none;
}

.sound{
  width:38px;
  height:38px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.65);

  border:1px solid rgba(255,30,40,.45);

  cursor:pointer;

  font-size:1rem;

  transition:.2s;
}

.sound:hover{
  box-shadow:0 0 20px rgba(255,20,30,.35);
}

/* MAIN */

main{
  flex:1;

  display:flex;
  flex-direction:column;
  align-items:center;

  min-height:0;
}

/* TITLE */

.hero{
  text-align:center;

  margin-top:5vh;
}

.hero h2{
  margin:0;

  font-size:3rem;
  font-weight:700;

  letter-spacing:-1px;
}

.hero h2 span{
  color:var(--red);
}

.hero p{
  margin:8px 0 0;

  color:#aaa;

  font-size:1.1rem;
}

/* MIC */

.mic-area{
  margin-top:45px;

  display:flex;
  flex-direction:column;
  align-items:center;
}

#mic{
  width:155px;
  height:155px;

  border-radius:50%;

  border:2px solid #ff2731;

  background:
    radial-gradient(
      circle,
      rgba(255,30,40,.20),
      rgba(20,0,0,.82) 65%
    );

  color:white;

  font-size:3.5rem;

  cursor:pointer;

  position:relative;

  box-shadow:
    0 0 25px rgba(255,20,30,.4),
    0 0 70px rgba(255,20,30,.15),
    inset 0 0 30px rgba(255,20,30,.12);

  transition:.25s;
}

#mic:hover{
  transform:scale(1.04);

  box-shadow:
    0 0 35px rgba(255,20,30,.65),
    0 0 90px rgba(255,20,30,.25),
    inset 0 0 35px rgba(255,20,30,.18);
}

#mic.on{
  animation:pulse 1.25s infinite;

  background:
    radial-gradient(
      circle,
      rgba(255,30,40,.42),
      rgba(20,0,0,.82) 65%
    );
}

.mic-label{
  margin-top:20px;

  color:#ff3943;

  font-size:.9rem;

  letter-spacing:.5px;
}

.wave{
  margin-top:8px;

  height:20px;

  display:flex;
  align-items:center;
  gap:4px;

  opacity:0;

  transition:.2s;
}

.wave.active{
  opacity:1;
}

.wave span{
  width:3px;
  height:8px;

  background:var(--red);

  border-radius:3px;

  animation:wave .8s infinite ease-in-out;
}

.wave span:nth-child(2){animation-delay:.1s}
.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.3s}
.wave span:nth-child(5){animation-delay:.2s}
.wave span:nth-child(6){animation-delay:.1s}

/* STATUS */

#status{
  min-height:25px;

  margin-top:7px;

  color:#aaa;

  font-size:.85rem;

  text-align:center;
}

/* AI RESPONSE AREA */

#log{
  width:100%;
  max-width:680px;

  overflow-y:auto;

  display:flex;
  flex-direction:column;

  gap:14px;

  padding:20px 4px 10px;

  scrollbar-width:none;
}

#log::-webkit-scrollbar{
  display:none;
}

/* AI MESSAGE */

.msg{
  width:100%;

  padding:18px 21px;

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(25,5,7,.88),
      rgba(5,5,5,.82)
    );

  border:1px solid var(--border);

  box-shadow:
    0 10px 35px rgba(0,0,0,.4),
    0 0 25px rgba(255,20,30,.08);

  animation:messageIn .3s ease-out;
}

.bot::before{
  content:"AI";

  display:block;

  color:var(--red);

  font-size:.72rem;

  font-weight:800;

  letter-spacing:1.5px;

  margin-bottom:7px;
}

.bot-text{
  font-size:1rem;

  line-height:1.55;

  color:#f2f2f2;
}

.speak-response{
  float:right;

  width:34px;
  height:34px;

  border-radius:50%;

  border:1px solid rgba(255,30,40,.4);

  background:rgba(255,20,30,.08);

  color:var(--red);

  cursor:pointer;

  transition:.2s;
}

.speak-response:hover{
  background:rgba(255,20,30,.2);

  box-shadow:0 0 15px rgba(255,20,30,.25);
}

.tag{
  font-size:.7rem;

  color:#ff6269;

  margin-top:-5px;
}

/* FOOTER */

footer{
  display:flex;
  justify-content:center;

  padding:10px 0 5px;
}

.hint{
  margin:0;

  font-size:.68rem;

  color:#666;

  text-align:center;
}

/* ANIMATIONS */

@keyframes pulse{

  0%{
    box-shadow:
      0 0 0 0 rgba(255,20,30,.65),
      0 0 30px rgba(255,20,30,.35);
  }

  70%{
    box-shadow:
      0 0 0 28px rgba(255,20,30,0),
      0 0 60px rgba(255,20,30,.45);
  }

  100%{
    box-shadow:
      0 0 0 0 rgba(255,20,30,0),
      0 0 30px rgba(255,20,30,.35);
  }

}

@keyframes wave{

  0%,100%{
    height:7px;
  }

  50%{
    height:20px;
  }

}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

@media(max-width:600px){

  .app{
    padding:16px;
  }

  header{
    padding-top:3px;
  }

  h1{
    font-size:1.15rem;
  }

  .hero{
    margin-top:5vh;
  }

  .hero h2{
    font-size:2.25rem;
  }

  .hero p{
    font-size:.95rem;
  }

  .mic-area{
    margin-top:35px;
  }

  #mic{
    width:125px;
    height:125px;

    font-size:2.8rem;
  }

  #log{
    max-width:100%;
  }

}


/* SCRIPT */

</style>
</head>

<body>

<div class="app">

  <header>

    <h1>
      Test <span>Chatbot</span>
    </h1>

    <div class="controls">

      <select id="lang" aria-label="Language">
        <option value="en-IN">English</option>
        <option value="hi-IN">हिन्दी</option>
      </select>

      <button
        class="sound"
        id="soundToggle"
        title="Toggle voice replies"
      >
        🔊
      </button>

    </div>

  </header>


  <main>

    <section class="hero">

      <h2>
        Talk to <span>me</span>
      </h2>

      <p>
        Tap the mic and speak
      </p>

    </section>


    <section class="mic-area">

      <button
        id="mic"
        aria-label="Start listening"
      >
        🎤
      </button>

      <div class="mic-label" id="micLabel">
        Tap to start listening
      </div>

      <div class="wave" id="wave">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

      </div>

      <div id="status"></div>

    </section>


    <div id="log"></div>

  </main>


  <footer>

    <p class="hint">
      Voice assistant • Speak naturally • AI responds with voice and text
    </p>

  </footer>

</div>


<script>

const $ = id => document.getElementById(id);

let banks = [];
let history = [];
let busy = false;
let listening = false;
let speakEnabled = true;


/* STATUS */

function status(text){
  $('status').textContent = text;
}


/* ADD AI MESSAGE */

function addAI(text){

  const wrapper = document.createElement('div');

  wrapper.className = 'msg bot';

  const content = document.createElement('div');

  content.className = 'bot-text';

  content.textContent = text;

  const speakButton = document.createElement('button');

  speakButton.className = 'speak-response';

  speakButton.textContent = '🔊';

  speakButton.title = 'Speak response';

  speakButton.onclick = () => speak(text);

  wrapper.appendChild(speakButton);

  wrapper.appendChild(content);

  $('log').appendChild(wrapper);

  $('log').scrollTop = $('log').scrollHeight;

}


/* ESCALATION */

function addTag(text){

  const d = document.createElement('div');

  d.className = 'tag';

  d.textContent = text;

  $('log').appendChild(d);

}


/* TEXT TO SPEECH */

function speak(text){

  if(
    !speakEnabled ||
    !('speechSynthesis' in window)
  ){
    return;
  }

  speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    $('lang').value;

  utterance.rate = 1;
  utterance.pitch = 1;

  utterance.onstart = () => {
    status('Speaking...');
  };

  utterance.onend = () => {
    status('');
  };

  speechSynthesis.speak(utterance);
}


/* SEND TO BACKEND */

async function sendVoice(text){

  if(!text || busy){
    return;
  }

  busy = true;

  status('Thinking...');

  try{

    const response = await fetch(
      '/api/chat',
      {
        method:'POST',

        headers:{
          'Content-Type':'application/json'
        },

        body:JSON.stringify({

          bank_id:
            banks.length
              ? banks[0].id
              : '',

          message:text,

          history:
            history.slice(-6)

        })
      }
    );


    if(!response.ok){

      throw new Error(
        response.status === 429
          ? 'Too many requests. Please wait a moment.'
          : 'Server error.'
      );

    }


    const data =
      await response.json();


    /* ONLY AI RESPONSE IS SHOWN */

    addAI(data.reply);


    if(data.escalate){

      addTag(
        'Escalating to a human agent'
      );

    }


    history.push(
      {
        role:'user',
        content:text
      },

      {
        role:'assistant',
        content:data.reply
      }
    );


    status('');

    speak(data.reply);

  }

  catch(error){

    addAI(
      error.message ||
      'Something went wrong.'
    );

    status('');

  }

  busy = false;

}


/* SPEECH RECOGNITION */

const SR =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

let rec = null;


if(SR){

  rec = new SR();

  rec.interimResults = true;

  rec.continuous = false;


  rec.onstart = () => {

    listening = true;

    $('mic').classList.add('on');

    $('wave').classList.add('active');

    $('micLabel').textContent =
      'Listening...';

    status('Speak now');

  };


  rec.onresult = event => {

    const result =
      event.results[
        event.results.length - 1
      ];

    const transcript =
      result[0].transcript;


    if(result.isFinal){

      $('micLabel').textContent =
        'Processing...';

      sendVoice(transcript);

    }

  };


  rec.onerror = event => {

    listening = false;

    $('mic').classList.remove('on');

    $('wave').classList.remove('active');


    if(event.error === 'not-allowed'){

      status(
        'Microphone access was blocked.'
      );

    }

    else{

      status(
        'Mic error: ' +
        event.error
      );

    }


    $('micLabel').textContent =
      'Tap to start listening';

  };


  rec.onend = () => {

    listening = false;

    $('mic').classList.remove('on');

    $('wave').classList.remove('active');


    if(!busy){

      $('micLabel').textContent =
        'Tap to start listening';

    }

  };

}

else{

  $('mic').disabled = true;

  $('mic').style.opacity = '.4';

  $('micLabel').textContent =
    'Speech recognition unavailable';

  status(
    'Speech recognition needs Chrome or Edge.'
  );

}


/* MIC BUTTON */

$('mic').onclick = () => {

  if(!rec || busy){
    return;
  }


  if(
    'speechSynthesis' in window
  ){

    speechSynthesis.cancel();

  }


  rec.lang =
    $('lang').value;


  if(listening){

    rec.stop();

  }

  else{

    rec.start();

  }

};


/* VOICE TOGGLE */

$('soundToggle').onclick = () => {

  speakEnabled =
    !speakEnabled;


  $('soundToggle').textContent =
    speakEnabled
      ? '🔊'
      : '🔇';


  if(!speakEnabled){

    speechSynthesis.cancel();

  }

};


/* LOAD BANKS */

fetch('/api/banks')

  .then(response =>
    response.json()
  )

  .then(data => {

    banks = data;

    /*
      We don't display the bank selector anymore.
      The first configured bank is used automatically.
    */

  })

  .catch(error => {

    console.error(
      'Could not load banks:',
      error
    );

  });

</script>

</body>
</html>
