<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bank Voice Assistant</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1b;--muted:#77756e;--accent:#1f6f5c;--user:#e4efe9;--border:#e2dfd6;--warn:#b3421f}
@media (prefers-color-scheme:dark){:root{--bg:#161817;--card:#212423;--text:#eeeeea;--muted:#9a9d97;--user:#23342e;--border:#333836}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:700px;height:100%;display:flex;flex-direction:column;padding:0 14px}
header{padding:14px 0 8px}h1{font-size:1.15rem;margin:0 0 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
select{padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.9rem}
#log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;border:1px solid var(--border)}
.user{align-self:flex-end;background:var(--user)}.bot{align-self:flex-start;background:var(--card)}
.tag{align-self:flex-start;font-size:.75rem;color:var(--warn);margin:-6px 0 0 6px}
#status{text-align:center;font-size:.85rem;color:var(--muted);min-height:1.3em}
.bar{display:flex;gap:8px;align-items:center;padding:8px 0}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border-radius:24px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:1rem}
button{border:none;cursor:pointer;font-size:1rem}
#mic{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;font-size:1.3rem;flex:none}
#mic.on{animation:pulse 1.1s infinite}
#send{padding:12px 16px;border-radius:24px;background:var(--text);color:var(--bg)}
.hint{font-size:.75rem;color:var(--muted);text-align:center;margin:0 0 12px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,111,92,.6)}100%{box-shadow:0 0 0 16px rgba(31,111,92,0)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Bank Voice Assistant</h1>
    <div class="row">
      <select id="bank" aria-label="Mode"></select>
      <select id="lang" aria-label="Language"><option value="en-IN">English</option><option value="hi-IN">हिन्दी</option></select>
      <label><input type="checkbox" id="speakOn" checked> Speak replies</label>
    </div>
  </header>
  <div id="log"></div>
  <div id="status"></div>
  <div class="bar">
    <button id="mic" aria-label="Speak">🎤</button>
    <input type="text" id="text" placeholder="Or type here..." autocomplete="off">
    <button id="send">Send</button>
  </div>
  <p class="hint">Never say card numbers, PINs or OTPs. Bank modes use fictional data.</p>
</div>
<script>
const $ = id => document.getElementById(id);
let banks = [], history = [], busy = false;

function add(text, cls) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
}
function tag(text) {
  const d = document.createElement('div'); d.className = 'tag'; d.textContent = text; $('log').appendChild(d);
}
const status = t => $('status').textContent = t;

function speak(t) {
  if (!$('speakOn').checked || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = $('lang').value;
  u.onstart = () => status('Speaking...'); u.onend = () => status('');
  speechSynthesis.speak(u);
}

function greet() {
  const b = banks.find(x => x.id === $('bank').value);
  history = []; $('log').innerHTML = ''; add(b.greeting, 'bot'); speak(b.greeting);
}

async function send() {
  const t = $('text').value.trim();
  if (!t || busy) return;
  $('text').value = ''; busy = true; add(t, 'user'); status('Thinking...');
  try {
    const r = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bank_id: $('bank').value, message: t, history: history.slice(-6) })
    });
    if (!r.ok) throw new Error(r.status === 429 ? 'Too many requests. Please wait a moment.' : 'Server error.');
    const d = await r.json();
    add(d.reply, 'bot'); if (d.escalate) tag('Escalating to a human agent');
    history.push({ role: 'user', content: t }, { role: 'assistant', content: d.reply });
    status(''); speak(d.reply);
  } catch (e) { add(e.message || 'Something went wrong.', 'bot'); status(''); }
  busy = false;
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR(); rec.interimResults = true; rec.continuous = false;
  rec.onstart = () => { listening = true; $('mic').classList.add('on'); status('Listening...'); };
  rec.onresult = e => { const r = e.results[e.results.length - 1]; $('text').value = r[0].transcript; if (r.isFinal) send(); };
  rec.onerror = e => status(e.error === 'not-allowed' ? 'Microphone access was blocked.' : 'Mic error: ' + e.error);
  rec.onend = () => { listening = false; $('mic').classList.remove('on'); if (!busy) status(''); };
} else { $('mic').disabled = true; $('mic').style.opacity = .4; status('Speech recognition needs Chrome or Edge. You can still type.'); }

$('mic').onclick = () => { if (!rec) return; speechSynthesis.cancel(); rec.lang = $('lang').value; listening ? rec.stop() : rec.start(); };
$('send').onclick = send;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('bank').onchange = greet;

fetch('/api/banks').then(r => r.json()).then(b => {
  banks = b; b.forEach(x => { const o = document.createElement('option'); o.value = x.id; o.textContent = x.name; $('bank').appendChild(o); });
  greet();
});
</script>
</body>
</html>
