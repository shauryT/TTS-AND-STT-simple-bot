<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>AI Voice Chatbot</title>


    <style>

        :root {
            --bg: #070707;
            --card: #111111;
            --text: #f5f5f5;
            --muted: #8b8b8b;
            --accent: #e50914;
            --border: #292929;
        }


        * {
            box-sizing: border-box;
        }


        html,
        body {
            height: 100%;
            margin: 0;
        }


        body {
            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(229, 9, 20, 0.12),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 10% 90%,
                    rgba(229, 9, 20, 0.06),
                    transparent 30%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                system-ui,
                -apple-system,
                "Segoe UI",
                sans-serif;

            display: flex;
            justify-content: center;
        }


        .app {
            width: 100%;
            max-width: 700px;
            height: 100%;

            display: flex;
            flex-direction: column;

            padding: 0 18px;
        }


        /* HEADER */

        header {
            padding: 22px 0 12px;
            text-align: center;
        }


        h1 {
            font-size: 1.35rem;
            margin: 0 0 14px;

            font-weight: 650;
            letter-spacing: 0.3px;
        }


        .row {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 12px;
            flex-wrap: wrap;

            font-size: 0.8rem;
            color: var(--muted);
        }


        select {
            padding: 8px 12px;

            border-radius: 10px;
            border: 1px solid var(--border);

            background: var(--card);
            color: var(--text);

            font-size: 0.85rem;
            outline: none;
        }


        select:focus {
            border-color: var(--accent);
        }


        /* CHAT */

        #log {
            flex: 1;

            overflow-y: auto;

            display: flex;
            flex-direction: column;

            gap: 12px;

            padding: 18px 3px;

            scroll-behavior: smooth;
        }


        #log::-webkit-scrollbar {
            width: 4px;
        }


        #log::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }


        /* MESSAGE BUBBLES */

        .msg {
            max-width: 82%;

            padding: 12px 16px;

            border-radius: 18px;

            line-height: 1.5;

            border: 1px solid var(--border);

            position: relative;

            animation: messageIn 0.25s ease-out;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.25);
        }


        .user {
            align-self: flex-end;

            background:
                linear-gradient(
                    135deg,
                    #2a0d0f,
                    #170909
                );

            border-color: #4b171b;

            border-bottom-right-radius: 5px;

            box-shadow:
                0 5px 25px rgba(229, 9, 20, 0.08);
        }


        .bot {
            align-self: flex-start;

            background:
                linear-gradient(
                    135deg,
                    #171717,
                    #0f0f0f
                );

            border-color: #303030;

            border-bottom-left-radius: 5px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.35);
        }


        .bot::before {
            content: "AI";

            display: block;

            color: var(--accent);

            font-size: 0.68rem;

            font-weight: 700;

            letter-spacing: 1px;

            margin-bottom: 4px;
        }


        /* STATUS */

        #status {
            text-align: center;

            font-size: 0.8rem;

            color: var(--muted);

            min-height: 1.3em;

            transition: 0.2s;
        }


        /* LARGE MICROPHONE */

        .mic-area {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            padding: 8px 0 18px;
        }


        #mic {
            width: 115px;
            height: 115px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ff1b27,
                    #b8000a
                );

            color: white;

            border: 2px solid #ff4b53;

            font-size: 2.7rem;

            cursor: pointer;

            box-shadow:
                0 0 25px rgba(229, 9, 20, 0.35),
                0 0 60px rgba(229, 9, 20, 0.12),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);

            transition: 0.25s;
        }


        #mic:hover {
            transform: scale(1.06);

            box-shadow:
                0 0 35px rgba(229, 9, 20, 0.55),
                0 0 75px rgba(229, 9, 20, 0.18),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
        }


        #mic.on {
            animation: pulse 1.1s infinite;

            background:
                linear-gradient(
                    145deg,
                    #ff3039,
                    #d0000b
                );
        }


        .mic-label {
            margin-top: 10px;

            font-size: 0.78rem;

            color: #777;
        }


        /* TEXT INPUT */

        .bar {
            display: flex;

            gap: 10px;

            align-items: center;

            padding: 4px 0 8px;
        }


        input[type="text"] {
            flex: 1;

            min-width: 0;

            padding: 13px 16px;

            border-radius: 25px;

            border: 1px solid var(--border);

            background: #111;

            color: var(--text);

            font-size: 0.95rem;

            outline: none;

            transition: 0.2s;
        }


        input[type="text"]:focus {
            border-color: #65171c;

            box-shadow:
                0 0 15px rgba(229, 9, 20, 0.08);
        }


        input[type="text"]::placeholder {
            color: #666;
        }


        #send {
            padding: 13px 18px;

            border-radius: 24px;

            border: none;

            background: #e9e9e9;

            color: #090909;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        #send:hover {
            background: white;

            transform: translateY(-1px);
        }


        /* ANIMATIONS */

        @keyframes pulse {

            0% {
                box-shadow:
                    0 0 0 0 rgba(229, 9, 20, 0.65),
                    0 0 25px rgba(229, 9, 20, 0.3);
            }


            70% {
                box-shadow:
                    0 0 0 22px rgba(229, 9, 20, 0),
                    0 0 40px rgba(229, 9, 20, 0.4);
            }


            100% {
                box-shadow:
                    0 0 0 0 rgba(229, 9, 20, 0),
                    0 0 25px rgba(229, 9, 20, 0.3);
            }

        }


        @keyframes messageIn {

            from {
                opacity: 0;
                transform: translateY(8px);
            }


            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header>

        <h1>AI Voice Chatbot</h1>

        <div class="row">

            <select id="lang" aria-label="Language">

                <option value="en-IN">
                    English
                </option>

                <option value="hi-IN">
                    हिन्दी
                </option>

            </select>


            <label>

                <input
                    type="checkbox"
                    id="speakOn"
                    checked
                >

                Speak replies

            </label>

        </div>

    </header>



    <!-- CHAT -->

    <div id="log"></div>



    <!-- STATUS -->

    <div id="status"></div>



    <!-- LARGE MICROPHONE -->

    <div class="mic-area">

        <button
            id="mic"
            aria-label="Speak"
        >
            🎤
        </button>


        <div
            class="mic-label"
            id="micLabel"
        >
            Tap to speak
        </div>

    </div>



    <!-- TEXT INPUT -->

    <div class="bar">

        <input
            type="text"
            id="text"
            placeholder="Type a message..."
            autocomplete="off"
        >


        <button id="send">
            Send
        </button>

    </div>


</div>



<script>

    const $ = id =>
        document.getElementById(id);


    let history = [];

    let busy = false;

    let listening = false;



    /* ADD MESSAGE */

    function add(text, cls) {

        const d =
            document.createElement("div");


        d.className =
            "msg " + cls;


        d.textContent = text;


        $("log").appendChild(d);


        $("log").scrollTop =
            $("log").scrollHeight;

    }



    /* STATUS */

    const status = text => {

        $("status").textContent = text;

    };



    /* TEXT TO SPEECH */

    function speak(text) {

        if (
            !$("speakOn").checked ||
            !("speechSynthesis" in window)
        ) {
            return;
        }


        speechSynthesis.cancel();


        const utterance =
            new SpeechSynthesisUtterance(text);


        utterance.lang =
            $("lang").value;


        utterance.onstart = () => {

            status("Speaking...");

        };


        utterance.onend = () => {

            if (!listening && !busy) {
                status("");
            }

        };


        speechSynthesis.speak(
            utterance
        );

    }



    /* INITIAL GREETING */

    add(
        "Hello! How can I help you today?",
        "bot"
    );



    /* SEND MESSAGE */

    async function send() {

        const text =
            $("text").value.trim();


        if (!text || busy) {
            return;
        }


        $("text").value = "";


        busy = true;


        add(
            text,
            "user"
        );


        status("Thinking...");


        try {

            const response =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            message: text,

                            history:
                                history.slice(-6)

                        })

                    }
                );


            if (!response.ok) {

                throw new Error(
                    response.status === 429
                        ? "Too many requests. Please wait a moment."
                        : "Server error."
                );

            }


            const data =
                await response.json();


            add(
                data.reply,
                "bot"
            );


            history.push(

                {
                    role: "user",
                    content: text
                },

                {
                    role: "assistant",
                    content: data.reply
                }

            );


            status("");


            speak(
                data.reply
            );

        }


        catch (error) {

            add(
                error.message ||
                "Something went wrong.",
                "bot"
            );


            status("");

        }


        busy = false;

    }



    /* SPEECH RECOGNITION */

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    let recognition = null;



    if (SpeechRecognition) {

        recognition =
            new SpeechRecognition();


        recognition.interimResults =
            true;


        recognition.continuous =
            false;



        /* START LISTENING */

        recognition.onstart = () => {

            listening = true;


            $("mic").classList.add(
                "on"
            );


            $("micLabel").textContent =
                "Listening...";


            status(
                "Listening..."
            );

        };



        /* SPEECH RESULT */

        recognition.onresult = event => {

            const result =
                event.results[
                    event.results.length - 1
                ];


            $("text").value =
                result[0].transcript;


            if (result.isFinal) {

                $("micLabel").textContent =
                    "Processing...";


                send();

            }

        };



        /* SPEECH ERROR */

        recognition.onerror = event => {

            status(

                event.error ===
                "not-allowed"

                    ? "Microphone access was blocked."

                    : "Mic error: " +
                      event.error

            );

        };



        /* STOP LISTENING */

        recognition.onend = () => {

            listening = false;


            $("mic").classList.remove(
                "on"
            );


            if (!busy) {

                $("micLabel").textContent =
                    "Tap to speak";


                status("");

            }

        };

    }


    else {

        $("mic").disabled = true;


        $("mic").style.opacity = "0.4";


        $("micLabel").textContent =
            "Speech recognition unavailable";


        status(
            "Speech recognition needs Chrome or Edge."
        );

    }



    /* MICROPHONE BUTTON */

    $("mic").onclick = () => {

        if (!recognition) {
            return;
        }


        speechSynthesis.cancel();


        if (listening) {

            recognition.stop();

            return;

        }


        recognition.lang =
            $("lang").value;


        try {

            recognition.start();

        }

        catch (error) {

            console.log(error);

        }

    };



    /* SEND BUTTON */

    $("send").onclick =
        send;



    /* ENTER KEY */

    $("text").addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                send();
            }

        }
    );

</script>


</body>

</html>
```
