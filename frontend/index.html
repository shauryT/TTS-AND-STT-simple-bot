<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1014;
    --bg-2:#14171D;
    --surface:#1B1F27;
    --surface-2:#232833;
    --line:#2A2F3A;
    --accent:#8B7CFF;
    --accent-dim:#4B4380;
    --accent-glow:rgba(139,124,255,.35);
    --text:#ECEDF1;
    --text-dim:#9095A1;
    --warn:#E2825B;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 22px; border-bottom:1px solid var(--line); flex-shrink:0;
  }
  header h1{
    font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600;
    margin:0; letter-spacing:.2px;
  }
  #status{ font-size:13px; color:var(--text-dim); min-height:16px; }

  main{ flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }

  /* --- Mic hero --- */
  #hero{
    flex-shrink:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; padding:22px 20px 18px;
    transition:padding .35s ease;
  }
  #hero.compact{ padding:14px 20px 10px; }

  #mic-wrap{ position:relative; width:132px; height:132px; transition:width .35s ease, height .35s ease; }
  #hero.compact #mic-wrap{ width:84px; height:84px; }

  .ring{
    position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--accent-dim); opacity:0;
  }
  #mic-wrap.listening .ring{ animation:pulse 1.8s ease-out infinite; }
  #mic-wrap.listening .ring:nth-child(2){ animation-delay:.5s; }
  #mic-wrap.listening .ring:nth-child(3){ animation-delay:1s; }
  #mic-wrap.speaking .ring{ animation:pulse-fast 1s ease-out infinite; border-color:var(--accent); }
  @keyframes pulse{ 0%{transform:scale(.7); opacity:.55;} 100%{transform:scale(1.55); opacity:0;} }
  @keyframes pulse-fast{ 0%{transform:scale(.8); opacity:.6;} 100%{transform:scale(1.3); opacity:0;} }

  #mic-btn{
    position:absolute; inset:10px; border-radius:50%; border:none; cursor:pointer;
    background:radial-gradient(circle at 32% 28%, #a89bff, var(--accent) 60%, #6c5fd6);
    box-shadow:0 0 0 1px rgba(255,255,255,.06) inset, 0 18px 40px -14px var(--accent-glow);
    display:flex; align-items:center; justify-content:center;
    transition:transform .15s ease, filter .2s ease;
  }
  #mic-btn:hover{ filter:brightness(1.08); }
  #mic-btn:active{ transform:scale(.94); }
  #mic-btn:disabled{ filter:grayscale(.6) brightness(.6); cursor:not-allowed; }
  #mic-btn svg{ width:38%; height:38%; }
  #hero.compact #mic-btn svg{ width:34%; height:34%; }

  #mic-label{ font-size:13px; color:var(--text-dim); text-align:center; min-height:16px; }

  /* --- Chat log --- */
  #log{
    flex:1; overflow-y:auto; padding:6px 18px 14px;
    display:flex; flex-direction:column; gap:10px;
    scroll-behavior:smooth;
  }
  .msg{
    max-width:78%; padding:11px 15px; border-radius:16px; font-size:15px;
    line-height:1.45; animation:rise .25s ease both; word-wrap:break-word;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }
  .bot{
    align-self:flex-start; background:var(--surface); border:1px solid var(--line);
    border-bottom-left-radius:5px;
  }
  .user{
    align-self:flex-end; background:var(--accent); color:#fff;
    border-bottom-right-radius:5px;
  }
  .msg.blocked, .msg.error{ border-color:var(--warn); }
  .cursor{ display:inline-block; width:7px; height:1em; background:var(--text-dim); vertical-align:text-bottom; margin-left:2px; animation:blink 1s step-start infinite; }
  @keyframes blink{ 50%{opacity:0;} }

  /* --- Input bar --- */
  #bar{
    flex-shrink:0; display:flex; align-items:center; gap:10px;
    padding:12px 16px; border-top:1px solid var(--line); background:var(--bg-2);
  }
  #text{
    flex:1; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:22px; padding:11px 16px; font:15px/1.3 'Inter',sans-serif; outline:none;
  }
  #text:focus{ border-color:var(--accent); }
  #send, #speak-toggle{
    flex-shrink:0; width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  #send{ background:var(--accent); color:#fff; border-color:transparent; }
  #send:disabled{ opacity:.4; cursor:default; }
  #speak-toggle.off{ color:var(--text-dim); }
  #speak-toggle.on{ color:var(--accent); border-color:var(--accent-dim); }
  #speak-toggle svg, #send svg{ width:19px; height:19px; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }

  @media (prefers-reduced-motion: reduce){
    .ring{ animation:none !important; }
    .msg{ animation:none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Voice Assistant</h1>
  <span id="status"></span>
</header>

<main>
  <div id="hero">
    <div id="mic-wrap">
      <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      <button id="mic-btn" aria-label="Start listening">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="9" y1="22" x2="15" y2="22"/>
        </svg>
      </button>
    </div>
    <div id="mic-label">Tap the mic and ask anything</div>
  </div>

  <div id="log"></div>
</main>

<div id="bar">
  <button id="speak-toggle" class="on" aria-label="Toggle spoken replies" title="Spoken replies">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="4 8 8 8 12 4 12 20 8 16 4 16 4 8"/>
      <path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/>
    </svg>
  </button>
  <input id="text" type="text" placeholder="Type a message…" autocomplete="off">
  <button id="send" aria-label="Send">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
    </svg>
  </button>
</div>

<script>
const $ = id => document.getElementById(id);
let history = [], busy = false, speakOn = true;

const micWrap = $('mic-wrap'), micBtn = $('mic-btn'), micLabel = $('mic-label'),
      hero = $('hero'), log = $('log'), status = $('status');

function setState(s){
  micWrap.classList.remove('listening','speaking');
  if (s === 'listening'){ micWrap.classList.add('listening'); micLabel.textContent = 'Listening…'; status.textContent = 'Listening'; }
  else if (s === 'speaking'){ micWrap.classList.add('speaking'); micLabel.textContent = 'Speaking…'; status.textContent = 'Speaking'; }
  else if (s === 'thinking'){ micLabel.textContent = 'Thinking…'; status.textContent = 'Thinking'; }
  else { micLabel.textContent = 'Tap the mic and ask anything'; status.textContent = ''; }
}

function add(text, cls, compact){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  if (compact && !hero.classList.contains('compact')) hero.classList.add('compact');
  return d;
}

// types out bot text progressively so it's readable while it's spoken
function typeOut(el, text, ms){
  return new Promise(resolve => {
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    const per = Math.max(12, Math.min(38, ms / Math.max(text.length, 1)));
    const timer = setInterval(() => {
      i++;
      el.textContent = text.slice(0, i);
      el.appendChild(cursor);
      log.scrollTop = log.scrollHeight;
      if (i >= text.length){ clearInterval(timer); cursor.remove(); resolve(); }
    }, per);
  });
}

function speak(text){
  return new Promise(resolve => {
    if (!speakOn || !('speechSynthesis' in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.onstart = () => setState('speaking');
    u.onend = () => { setState('idle'); resolve(); };
    u.onerror = () => { setState('idle'); resolve(); };
    speechSynthesis.speak(u);
  });
}

async function sendMessage(t){
  t = t.trim();
  if (!t || busy) return;
  busy = true; $('send').disabled = true;
  add(t, 'user', true);
  history.push({ role: 'user', content: t });
  setState('thinking');
  try{
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: t, history: history.slice(-6) })
    });
    const d = await res.json();
    history.push({ role: 'assistant', content: d.reply });
    const el = add('', 'bot ' + (d.mode || ''), true);
    const speakPromise = speak(d.reply);
    await typeOut(el, d.reply, Math.max(900, d.reply.length * 45));
    await speakPromise;
  } catch(e){
    add("I couldn't reach the server. Please check your connection.", 'bot error', true);
  } finally {
    busy = false; $('send').disabled = false; setState('idle');
  }
}

$('send').onclick = () => { const t = $('text').value; $('text').value = ''; sendMessage(t); };
$('text').addEventListener('keydown', e => { if (e.key === 'Enter'){ const t = $('text').value; $('text').value=''; sendMessage(t); } });

$('speak-toggle').onclick = () => {
  speakOn = !speakOn;
  $('speak-toggle').classList.toggle('on', speakOn);
  $('speak-toggle').classList.toggle('off', !speakOn);
  if (!speakOn) speechSynthesis.cancel();
};

// --- Speech recognition ---
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR){
  rec = new SR();
  rec.lang = 'en-IN';
  rec.interimResults = true;
  rec.onresult = e => {
    let t = '';
    for (const r of e.results) t += r[0].transcript;
    $('text').value = t;
    if (e.results[e.results.length - 1].isFinal){
      $('text').value = '';
      sendMessage(t);
    }
  };
  rec.onend = () => { listening = false; if (micWrap.classList.contains('listening')) setState('idle'); };
  rec.onerror = () => { listening = false; setState('idle'); };
} else {
  micBtn.disabled = true;
  micLabel.textContent = 'Voice input isn\u2019t supported in this browser \u2014 type instead';
}

micBtn.onclick = () => {
  if (!rec || busy) return;
  speechSynthesis.cancel();
  if (listening){ rec.stop(); listening = false; setState('idle'); return; }
  listening = true; setState('listening');
  try { rec.start(); } catch(e){}
};

function greet(){
  const g = "Hi! I'm your voice assistant. Ask me anything.";
  add(g, 'bot');
  speak(g);
}
greet();
</script>
</body>
</html>
